[workspace]
resolver = "2"
members = ["math-core", "state-store", "agent-core", "config-layer"]

[workspace.dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
rayon = "1.8"
thiserror = "1.0"
bincode = "1.3"
serde_json = "1.0"
criterion = "0.5"

agent-core = { path = "agent-core" }
config-layer = { path = "config-layer" }
math-core = { path = "math-core" }
state-store = { path = "state-store" }

[package]
name = "adaptive-agent-framework"
version = "0.1.0"
edition = "2021"

[dependencies]
math-core = { workspace = true }
state-store = { workspace = true }
agent-core = { workspace = true }
config-layer = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

[[example]]
name = "grid_stability"
path = "examples/grid_stability.rs"

[[example]]
name = "viral_campaign"
path = "examples/viral_campaign.rs"

[[example]]
name = "swarm_management"
path = "examples/swarm_management.rs"

[dev-dependencies]
criterion = { workspace = true }
agent-core = { workspace = true }

[[bench]]
name = "population_benchmark"
harness = false